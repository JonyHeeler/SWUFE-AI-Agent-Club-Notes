  const data=await response.json();if(!Array.isArray(data)||data.some(ch=>!ch||['path','title','number','group','content'].some(key=>typeof ch[key]!=='string')))throw new Error('正文数据无效');
  if(connectionFailed)notice('已重新连接阅读器');connectionFailed=false;
  const next=data.filter(ch=>!isConstruction(ch.title)&&!ch.path.split('/').some(isConstruction)),snapshot=JSON.stringify(next);if(snapshot===liveSnapshot)return;
  const previous=current,initial=!liveSnapshot;chapters.splice(0,chapters.length,...next);chapterByPath.clear();for(const chapter of chapters)chapterByPath.set(chapter.path,chapter);
  renderNav($('search').value);
  if(previous&&chapterByPath.has(previous.path)){showChapter(previous.path,true);if(previous.content!==current.content)notice('正文已更新');}
  else if(chapters.length){current=null;navigateHash();if(!initial)history.replaceState(null,'',chapterHash(current.path));}
  else{current=null;$('article-title').textContent='暂无可阅读章节';$('crumb-title').textContent='暂无章节';$('chapter-tag').textContent='学习资料';$('read-time').textContent='';$('content').replaceChildren();makeToc();$('previous').disabled=true;$('next').disabled=true;updateRead();}
  updateProgress();liveSnapshot=snapshot;if(initial)startReaderCheck();
 }catch(error){if(!connectionFailed)notice('无法读取正文，请确认阅读器启动窗口仍在运行；稍后自动重试。');connectionFailed=true;}
 finally{setTimeout(refreshChapters,2000);}
}

document.documentElement.style.setProperty('--body-size',state.font+'px');document.body.classList.toggle('dark',state.dark);updateRead();
if(location.protocol==='file:'){$('article-title').textContent='请通过启动入口打开';$('crumb-title').textContent='动态阅读器';const tip=document.createElement('p');tip.textContent='双击同目录的“启动阅读器.cmd”，即可阅读最新正文，保存后页面会自动更新。';$('content').replaceChildren(tip);}
else{$('article-title').textContent='正在读取正文…';refreshChapters();}</script></body></html>
