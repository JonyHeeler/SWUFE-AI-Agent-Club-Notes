<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <!-- Drop Shadow for Frame -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>

    <!-- Wheel Definition -->
    <g id="wheel">
      <!-- Tire -->
      <circle cx="0" cy="0" r="66" fill="none" stroke="#1F2937" stroke-width="14" />
      <!-- Inner Rim -->
      <circle cx="0" cy="0" r="59" fill="none" stroke="#94A3B8" stroke-width="4" />
      <!-- Spokes -->
      <g stroke="#CBD5E1" stroke-width="2">
         <line x1="0" y1="-59" x2="0" y2="59" />
         <line x1="-59" y1="0" x2="59" y2="0" />
         <line x1="-42" y1="-42" x2="42" y2="42" />
         <line x1="-42" y1="42" x2="42" y2="-42" />
         <line x1="-22.5" y1="-54.5" x2="22.5" y2="54.5" />
         <line x1="22.5" y1="-54.5" x2="-22.5" y2="54.5" />
         <line x1="-54.5" y1="-22.5" x2="54.5" y2="22.5" />
         <line x1="-54.5" y1="22.5" x2="54.5" y2="-22.5" />
      </g>
      <!-- Hub -->
      <circle cx="0" cy="0" r="10" fill="#475569" />
      <circle cx="0" cy="0" r="5" fill="#E2E8F0" />
    </g>
  </defs>

  <!-- 1. Sky & Environment -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)" />
  
  <g id="sun">
    <circle cx="680" cy="120" r="80" fill="#FEF08A" opacity="0.3" />
    <circle cx="680" cy="120" r="60" fill="#FEF08A" opacity="0.6" />
    <circle cx="680" cy="120" r="40" fill="#FDE047" />
  </g>

  <g id="clouds">
    <!-- Cloud 1 -->
    <path d="M 150 180 Q 150 140, 190 140 Q 210 110, 250 140 Q 290 140, 290 180 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Cloud 2 -->
    <path d="M 600 280 Q 600 250, 630 250 Q 650 230, 670 250 Q 700 250, 700 280 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- Cloud 3 -->
    <path d="M 350 120 Q 350 100, 370 100 Q 380 90, 390 100 Q 410 100, 410 120 Z" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <g id="hills">
    <path d="M 0 520 Q 250 420, 550 520 Z" fill="#D1FAE5" />
    <path d="M 400 520 Q 650 450, 800 520 Z" fill="#A7F3D0" />
  </g>

  <g id="road">
    <rect x="0" y="520" width="800" height="80" fill="#94A3B8" />
    <line x1="0" y1="520" x2="800" y2="520" stroke="#475569" stroke-width="6" />
    <line x1="0" y1="560" x2="800" y2="560" stroke="#CBD5E1" stroke-width="6" stroke-dasharray="40,40" />
  </g>

  <g id="wind" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="250" x2="160" y2="250" />
    <line x1="50" y1="270" x2="120" y2="270" />
    <line x1="120" y1="100" x2="180" y2="100" />
    <line x1="600" y1="180" x2="650" y2="180" />
    <line x1="720" y1="350" x2="780" y2="350" />
  </g>

  <!-- 2. Far Side Character Elements -->
  <g id="back-scarf">
    <path d="M 365 85 C 300 70, 250 90, 180 75 C 220 95, 280 100, 365 100 Z" fill="#10B981" />
    <path d="M 365 85 C 290 50, 220 70, 160 40 C 210 70, 280 80, 365 100 Z" fill="#059669" />
  </g>

  <g id="back-wing">
    <!-- Wing Base -->
    <path d="M 260 100 C 220 40, 160 20, 120 20 C 150 50, 180 90, 230 120 Z" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="3"/>
    <!-- Black Flight Feathers -->
    <path d="M 165 35 C 145 25, 130 20, 120 20 C 135 35, 145 45, 155 55 Z" fill="#374151" />
  </g>

  <g id="back-leg-crank">
    <!-- Crank Arm -->
    <line x1="350" y1="450" x2="330" y2="410" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <!-- Pedal Base -->
    <rect x="315" y="400" width="30" height="12" rx="4" fill="#334155" />
    <!-- Leg -->
    <path d="M 270 240 L 330 405" stroke="#FB923C" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Webbed Foot -->
    <path d="M 320 400 Q 350 390, 360 410 Q 330 420, 310 410 Z" fill="#F97316" />
  </g>

  <!-- 3. Bicycle Elements -->
  <g id="wheels">
    <use href="#wheel" x="200" y="450" />
    <use href="#wheel" x="550" y="450" />
  </g>

  <g id="fenders">
    <!-- Rear Fender -->
    <path d="M 120 450 A 80 80 0 0 1 260 397" fill="none" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>
    <!-- Front Fender -->
    <path d="M 470 450 A 80 80 0 0 1 610 397" fill="none" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g id="bike-frame">
    <!-- Main Frame Body -->
    <path d="M 200 450 L 350 450 L 491 310 L 470 260 
             M 350 450 L 290 270 L 470 260 
             M 200 450 L 290 270 
             M 470 260 L 550 450" 
          stroke="#EF4444" stroke-width="16" fill="none" 
          stroke-linecap="round" stroke-linejoin="round" 
          filter="url(#shadow)"/>
    
    <!-- Tubular Highlight -->
    <path d="M 200 450 L 350 450 L 491 310 L 470 260 
             M 350 450 L 290 270 L 470 260 
             M 200 450 L 290 270 
             M 470 260 L 550 450" 
          stroke="#FCA5A5" stroke-width="4" fill="none" 
          stroke-linecap="round" stroke-linejoin="round" 
          transform="translate(-2, -2)"/>
  </g>

  <g id="drivetrain-base">
    <!-- Chainring -->
    <circle cx="350" cy="450" r="28" fill="none" stroke="#475569" stroke-width="6" stroke-dasharray="4,4" />
    <circle cx="350" cy="450" r="24" fill="#64748B" />
    <circle cx="350" cy="450" r="10" fill="#0F172A" />
    <!-- Chain -->
    <path d="M 200 438 L 350 422 A 28 28 0 0 1 350 478 L 200 462 A 12 12 0 0 1 200 438 Z" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="4,2"/>
  </g>

  <g id="basket">
    <!-- Fish -->
    <path d="M 505 210 C 505 180, 530 170, 540 190 C 530 195, 525 200, 520 210 Z" fill="#9CA3AF" />
    <path d="M 540 190 L 555 180 L 550 195 Z" fill="#9CA3AF" />
    <circle cx="515" cy="190" r="2" fill="#111" />
    <!-- Wicker Basket -->
    <path d="M 480 210 L 530 210 L 520 260 L 490 260 Z" fill="#D97706" />
    <path d="M 480 210 L 530 210 L 520 260 L 490 260 Z" fill="none" stroke="#B45309" stroke-width="4" stroke-linejoin="round"/>
    <!-- Weave Lines -->
    <line x1="490" y1="210" x2="495" y2="260" stroke="#B45309" stroke-width="2"/>
    <line x1="500" y1="210" x2="505" y2="260" stroke="#B45309" stroke-width="2"/>
    <line x1="510" y1="210" x2="515" y2="260" stroke="#B45309" stroke-width="2"/>
    <line x1="520" y1="210" x2="520" y2="260" stroke="#B45309" stroke-width="2"/>
    <line x1="485" y1="225" x2="525" y2="225" stroke="#B45309" stroke-width="2"/>
    <line x1="488" y1="245" x2="522" y2="245" stroke="#B45309" stroke-width="2"/>
  </g>

  <g id="saddle-bars">
    <!-- Seatpost -->
    <line x1="290" y1="270" x2="275" y2="230" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <!-- Saddle -->
    <path d="M 250 230 C 270 220, 290 225, 305 235 C 310 240, 300 245, 275 245 C 245 245, 230 240, 250 230 Z" fill="#1F2937" />
    <!-- Stem -->
    <line x1="470" y1="260" x2="455" y2="220" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <!-- Handlebar Bar -->
    <path d="M 455 220 Q 490 200, 470 190" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <!-- Cute Bell -->
    <path d="M 452 205 A 8 8 0 0 1 468 205 Z" fill="#FCD34D" transform="rotate(-20 460 205)" />
    <circle cx="457" cy="198" r="2" fill="#F59E0B" />
    <!-- Grip -->
    <line x1="475" y1="185" x2="465" y2="195" stroke="#111" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- 4. Main Character Body -->
  <g id="pelican-body">
    <!-- Plump Body & Neck Path -->
    <path d="M 170 200
             C 150 150, 230 110, 310 80
             C 350 65, 360 20, 380 20
             C 400 20, 420 30, 420 50
             C 420 70, 380 90, 370 130
             C 350 210, 330 260, 280 260
             C 230 260, 190 260, 170 250
             L 130 240 L 160 225 L 140 210 L 170 200 Z" 
          fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g id="pelican-head">
    <!-- Lower Mandible (Pouch) overlapping front of neck -->
    <path d="M 410 60 C 430 65, 520 75, 610 95 C 570 190, 450 180, 375 110 C 385 90, 395 70, 410 60 Z" 
          fill="#F97316" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>
    <!-- Upper Mandible (Beak) -->
    <path d="M 410 45 C 500 40, 580 70, 620 90 C 630 95, 620 100, 610 95 C 520 75, 430 65, 410 60 Z" 
          fill="#FBBF24" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
    <!-- Eye Details -->
    <circle cx="400" cy="35" r="9" fill="#FEF08A" />
    <circle cx="402" cy="35" r="4" fill="#111" />
    <circle cx="404" cy="34" r="1.5" fill="#FFF" />
    <path d="M 395 25 Q 405 20, 410 28" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 5. Near Side Character Elements -->
  <g id="front-scarf">
    <!-- Neck Wrap -->
    <path d="M 360 70 C 390 60, 400 90, 370 100 C 345 90, 345 80, 360 70 Z" fill="#34D399" />
  </g>

  <g id="cap">
    <!-- Retro Cycling Cap Dome -->
    <path d="M 370 20 C 370 -5, 415 -5, 420 20 Z" fill="#3B82F6" />
    <!-- Cap Stripe -->
    <path d="M 390 0 C 395 -5, 405 -5, 405 20 L 390 20 Z" fill="#F8F9FA" />
    <!-- Flipped Brim -->
    <path d="M 420 20 C 435 10, 445 10, 450 25 C 435 20, 425 25, 420 25 Z" fill="#EF4444" />
  </g>

  <g id="front-wing">
    <!-- Wing Base stretching to handlebars -->
    <path d="M 280 140 C 350 150, 420 170, 470 190 C 450 210, 420 210, 400 200 C 330 180, 270 190, 260 160 Z" 
          fill="#F3F4F6" stroke="#D1D5DB" stroke-width="3" stroke-linejoin="round"/>
    <!-- Black Flight Feathers on Wing Tip -->
    <path d="M 420 175 C 440 182, 460 187, 470 190 C 450 210, 430 208, 410 198 Z" fill="#374151" />
  </g>

  <g id="front-leg-crank">
    <!-- Crank Arm -->
    <line x1="350" y1="450" x2="370" y2="490" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <!-- Pedal Base -->
    <rect x="355" y="485" width="30" height="12" rx="4" fill="#334155" />
    <!-- Front Leg -->
    <path d="M 290 240 L 350 350 L 370 485" stroke="#FB923C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Webbed Foot resting over pedal -->
    <path d="M 360 480 Q 400 470, 420 490 Q 400 510, 350 500 Z" fill="#F97316" />
  </g>
</svg>