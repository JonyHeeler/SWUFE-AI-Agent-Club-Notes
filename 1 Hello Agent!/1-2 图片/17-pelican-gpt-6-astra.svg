<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"
     viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a golden bill and coral scarf pedals a teal bicycle beside the sea.</desc>

  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#faf6eb"/>
      <stop offset="1" stop-color="#f0f3e9"/>
    </linearGradient>
    <linearGradient id="feathers" x2=".7" y2="1">
      <stop stop-color="#fffef7"/>
      <stop offset="1" stop-color="#e6ede7"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffda83"/>
      <stop offset="1" stop-color="#eda64d"/>
    </linearGradient>

    <g id="wheel">
      <circle r="108" fill="none" stroke="#263e47" stroke-width="12"/>
      <circle r="99" fill="none" stroke="#fffdf2" stroke-width="4"/>
      <g stroke="#94aaa7" stroke-width="2.3">
        <path d="M-95 0H95 M0-95V95"/>
        <path d="M-82-47.5 82 47.5 M-47.5-82 47.5 82"/>
        <path d="M-82 47.5 82-47.5 M-47.5 82 47.5-82"/>
      </g>
      <path d="M-84-65 A106 106 0 0 1-24-103"
            fill="none" stroke="#fff" stroke-width="3" opacity=".45"
            stroke-linecap="round"/>
      <circle r="10" fill="#263e47"/>
      <circle r="4" fill="#efbc68"/>
    </g>

    <path id="frame" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          d="M285 535 428 432 465 531Z
             M428 432 606 417
             M615 443 465 531
             M606 417 621 458
             M621 458Q644 509 671 535"/>
  </defs>

  <!-- Sunny seaside backdrop -->
  <rect width="960" height="720" fill="url(#background)"/>
  <circle cx="751" cy="145" r="63" fill="#efd887"/>
  <circle cx="751" cy="145" r="48" fill="#f5e3a3"/>

  <g fill="#fffdf5">
    <path d="M133 224c0-13 11-23 24-23 3-22 34-31 48-12
             17-7 35 4 36 20 17-4 29 4 30 15Z"/>
    <path d="M759 328c1-12 12-20 25-17 7-24 42-25 50-2
             17-5 32 3 35 19Z"/>
  </g>

  <path d="M0 478C154 463 257 489 411 475S755 458 960 479V635H0Z"
        fill="#e1ede5"/>
  <g fill="none" stroke="#c2d8cf" stroke-width="3" stroke-linecap="round">
    <path d="M37 511h90m-44 15h57m665-24h96m-61 18h81"/>
    <path d="M94 443q12-12 24 0 12-12 24 0"/>
    <path d="M825 425q9-9 18 0 9-9 18 0"/>
  </g>

  <path d="M0 628Q257 614 480 628T960 626V720H0Z" fill="#eee5d3"/>
  <ellipse cx="480" cy="652" rx="314" ry="16" fill="#263e47" opacity=".09"/>
  <path d="M125 650H835" stroke="#cec9b8" stroke-width="3" stroke-linecap="round"/>

  <g stroke="#abc2b9" stroke-width="5" stroke-linecap="round">
    <path d="M159 348h66"/>
    <path d="M119 374h88"/>
    <path d="M169 400h54"/>
  </g>

  <!-- Bicycle wheels and chain -->
  <use href="#wheel" transform="translate(285 535)"/>
  <use href="#wheel" transform="translate(671 535)"/>

  <path d="M285 523 465 508C495 508 495 554 465 554L285 548
           C268 548 268 523 285 523Z"
        fill="none" stroke="#7c918b" stroke-width="3"/>
  <circle cx="285" cy="535" r="13" fill="#efbc68" stroke="#263e47" stroke-width="3"/>

  <!-- Far leg -->
  <path d="M420 401 390 451 411 533" fill="none"
        stroke="#263e47" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420 401 390 451 411 533" fill="none"
        stroke="#d99a4b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M465 531 429 558" stroke="#263e47" stroke-width="7"/>
  <rect x="408" y="554" width="40" height="9" rx="3" fill="#263e47"/>
  <path d="M410 528 425 542 442 548 437 554 414 553 401 537Z"
