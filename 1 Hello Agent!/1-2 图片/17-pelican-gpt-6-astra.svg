  <path d="M606 417 594 373 619 359
           C635 350 652 356 659 370
           C665 382 657 394 647 394"
        fill="none" stroke="#263e47" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M606 417 594 373 619 359
           C635 350 652 356 659 370
           C665 382 657 394 647 394"
        fill="none" stroke="#c3d3cb" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M639 357Q653 361 659 372"
        fill="none" stroke="#263e47" stroke-width="11" stroke-linecap="round"/>
  <circle cx="647" cy="394" r="5" fill="#e77759"/>

  <!-- Near leg and webbed pedaling foot -->
  <path d="M473 400 499 438Q502 443 497 449L473 482"
        fill="none" stroke="#263e47" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M473 400 499 438Q502 443 497 449L473 482"
        fill="none" stroke="#efb04f" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M465 531 501 512" stroke="#263e47" stroke-width="8" stroke-linecap="round"/>
  <path d="M465 531 501 512" stroke="#b4c4bb" stroke-width="3" stroke-linecap="round"/>
  <rect x="479" y="508" width="47" height="9" rx="3" fill="#263e47"/>
  <path d="M473 480Q483 483 491 491L511 493 506 499 523 502
