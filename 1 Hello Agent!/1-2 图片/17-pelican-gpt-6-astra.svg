  <path d="M354 325
           C383 311 415 303 446 308
           C458 310 469 314 478 316
           C495 290 504 261 501 233
           C497 203 498 176 519 160
           C539 143 568 147 583 163
           C595 176 601 193 592 212
           C585 230 568 241 558 263
           C547 287 554 315 548 342
           C545 374 525 396 495 406
           C459 419 412 413 382 394
           C355 377 341 356 333 340Z"
        fill="url(#feathers)" stroke="#263e47" stroke-width="4.5" stroke-linejoin="round"/>

  <path d="M570 232C542 264 544 294 538 326
           C535 348 523 367 507 379
           C534 366 546 348 548 329
           C547 302 547 285 558 263Z"
        fill="#cfddd4" opacity=".65"/>
  <path d="M350 355C378 383 427 397 474 392
           C501 390 525 377 540 361
           C531 385 516 400 495 406
           C455 420 412 413 382 394
           C367 384 357 369 350 355Z"
        fill="#dce6dd"/>
  <path d="M363 358q8 11 18 14m-9 3q8 9 17 11"
        fill="none" stroke="#b9cbc0" stroke-width="3" stroke-linecap="round"/>

  <!-- Wing reaching for the handlebar -->
  <path d="M389 328
           C420 313 449 324 479 345
           C505 364 540 371 576 357
           C596 349 617 351 638 363
           Q647 368 641 376Q638 380 631 375
           L614 368
           C593 370 577 382 550 389
           C511 399 477 387 447 372
           C419 359 400 345 389 328Z"
        fill="#f8faf0" stroke="#263e47" stroke-width="4" stroke-linejoin="round"/>

  <path d="M412 349C441 366 477 378 509 380
           C542 382 565 371 594 363L614 368
           C593 370 577 382 550 389
           C511 399 477 387 447 372
           C433 365 420 356 412 349Z"
        fill="#344c54"/>
  <path d="M610 353Q624 357 638 363Q647 368 641 376
           Q638 380 631 375L614 368 603 368Z"
        fill="#344c54"/>
  <path d="M424 338Q456 360 490 366M439 338Q462 349 479 353"
        fill="none" stroke="#c3d1c6" stroke-width="3" stroke-linecap="round"/>

  <!-- Windblown coral scarf -->
  <g fill="#e97759" stroke="#263e47" stroke-width="3.5" stroke-linejoin="round">
    <path d="M503 263C485 253 463 256 446 273L468 274 466 287
             C486 282 501 276 510 268Z"/>
    <path d="M501 252Q528 266 562 258L557 277
             Q525 283 498 270Z"/>
    <circle cx="504" cy="266" r="7"/>
  </g>
  <path d="M516 264Q536 270 552 266"
        fill="none" stroke="#ffb28b" stroke-width="3" stroke-linecap="round"/>

  <!-- Distinctive pelican pouch and long bill -->
  <path d="M585 210 781 220
           C754 240 698 276 654 275
           C617 274 594 250 585 221Z"
        fill="url(#pouch)" stroke="#263e47" stroke-width="4" stroke-linejoin="round"/>
  <path d="M609 235Q626 260 652 264M628 234Q649 254 677 255"
        fill="none" stroke="#cf8c40" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>

  <path d="M586 186C635 188 718 201 785 216
           Q792 218 788 225L779 231 780 222 583 215Z"
        fill="#f4ba54" stroke="#263e47" stroke-width="4" stroke-linejoin="round"/>
  <path d="M612 195Q690 203 759 215"
        fill="none" stroke="#ffe4a3" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="614" cy="201" rx="4.5" ry="2" fill="#a67535"/>

  <!-- Expressive face -->
  <ellipse cx="553" cy="205" rx="10" ry="6" fill="#edc7ab" opacity=".45"/>
  <circle cx="564" cy="184" r="11" fill="#efbc61"/>
  <circle cx="566" cy="184" r="6" fill="#263e47"/>
  <circle cx="568" cy="181" r="2" fill="#fff"/>
  <path d="M552 171Q561 167 570 172M583 219Q576 225 572 233"
        fill="none" stroke="#263e47" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Small stones along the path -->
  <g fill="#c7c1ac">
    <ellipse cx="190" cy="677" rx="8" ry="2.5"/>
    <ellipse cx="731" cy="682" rx="11" ry="3"/>
    <ellipse cx="770" cy="672" rx="5" ry="2"/>
    <ellipse cx="352" cy="691" rx="6" ry="2"/>
  </g>
</svg>