  <!-- Teal bicycle frame -->
  <use href="#frame" stroke="#263e47" stroke-width="16"/>
  <use href="#frame" stroke="#48a69c" stroke-width="10"/>
  <path d="M449 430 575 420" stroke="#a5ded0" stroke-width="3" stroke-linecap="round"/>

  <circle cx="465" cy="531" r="26" fill="#fff8e5" stroke="#263e47" stroke-width="4"/>
  <circle cx="465" cy="531" r="17" fill="#e9bf73" stroke="#263e47" stroke-width="2.5"/>
  <circle cx="465" cy="531" r="6" fill="#263e47"/>
  <circle cx="671" cy="535" r="7" fill="#263e47"/>

